name: iPhone sideload build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    environment: family-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Configure family Firebase project
        env:
          FIREBASE_IOS_BASE64: ${{ secrets.FIREBASE_IOS_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, plistlib
          encoded = os.environ.get('FIREBASE_IOS_BASE64', '')
          if not encoded:
              raise SystemExit('Add FIREBASE_IOS_BASE64 to the family-pilot environment first.')
          data = base64.b64decode(encoded, validate=True)
          config = plistlib.loads(data)
          if config.get('PROJECT_ID') != 'famgpslink' or config.get('BUNDLE_ID') != 'com.famgpslink.famgpslink':
              raise SystemExit('Firebase configuration must be for the FamGPSlink iOS app.')
          if config.get('DATABASE_URL') != 'https://famgpslink-default-rtdb.asia-southeast1.firebasedatabase.app':
              raise SystemExit('Firebase configuration is missing the family database URL.')
          pathlib.Path('ios/Runner/GoogleService-Info.plist').write_bytes(data)
          PY
      - run: flutter pub get
      # Release mode runs without a debugger/JIT. AltStore supplies device signing later.
      - run: flutter build ios --release --no-codesign --build-number=$((1000 + ${{ github.run_number }}))
      - name: Package unsigned app for AltStore
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          python3 - <<'PY'
          import pathlib, plistlib
          app = pathlib.Path('build/ios/iphoneos/Runner.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          config = plistlib.loads((app / 'GoogleService-Info.plist').read_bytes())
          if info['CFBundleIdentifier'] != config['BUNDLE_ID'] or config['PROJECT_ID'] != 'famgpslink':
              raise SystemExit('Built app does not contain the expected family Firebase configuration.')
          PY
          mkdir -p build/ios/sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/sideload/Payload/Runner.app
          cd build/ios/sideload
          zip -r -y famgpslink-unsigned.ipa Payload
          shasum -a 256 famgpslink-unsigned.ipa > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          info = plistlib.loads(pathlib.Path('Payload/Runner.app/Info.plist').read_bytes())
          manifest = {
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'workflowRun': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
          }
          pathlib.Path('BUILD_INFO.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: famgpslink-iphone-sideload
          path: |
            build/ios/sideload/famgpslink-unsigned.ipa
            build/ios/sideload/SHA256SUMS.txt
            build/ios/sideload/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
