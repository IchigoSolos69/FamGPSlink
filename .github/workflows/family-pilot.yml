name: Family pilot builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, both]
        default: android
      upload_testflight:
        description: Upload the signed iPhone build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    environment: family-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Configure family Firebase project
        env:
          FIREBASE_ANDROID_BASE64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_BASE64" || { echo 'Missing Firebase Android configuration'; exit 1; }
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo 'Missing stable Android pilot signing key'; exit 1; }
          printf '%s' "$FIREBASE_ANDROID_BASE64" | base64 --decode > android/app/google-services.json
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: flutter pub get
      - run: flutter build apk --debug --build-number=$((1000 + ${{ github.run_number }}))
      - uses: actions/upload-artifact@v4
        with:
          name: famgpslink-family-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    environment: family-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: gem install xcodeproj --no-document
      - name: Sign and export iPhone build
        env:
          FIREBASE_IOS_BASE64: ${{ secrets.FIREBASE_IOS_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/ios-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: famgpslink-signed-iphone-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
      - name: Upload to TestFlight
        if: inputs.upload_testflight
        env:
          APPSTORE_KEY_BASE64: ${{ secrets.APPSTORE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/appstore-keys
        run: |
          set -euo pipefail
          test -n "$APPSTORE_KEY_BASE64" && test -n "$APPSTORE_KEY_ID" && test -n "$APPSTORE_ISSUER_ID"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          trap 'rm -f "$API_PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_KEY_ID.p8"' EXIT
          printf '%s' "$APPSTORE_KEY_BASE64" | base64 --decode > "$API_PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_KEY_ID.p8"
          chmod 600 "$API_PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$(find build/ios/ipa -name '*.ipa' -print -quit)" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
